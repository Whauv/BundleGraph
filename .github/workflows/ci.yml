name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[app,test]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m compileall -q src

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.sandbox.yml up --detach --build --wait
      - run: curl --fail --show-error http://127.0.0.1:8080/healthz
      - run: curl --fail --show-error http://127.0.0.1:8080/readyz
      - run: curl --fail --show-error http://127.0.0.1:8080/runtime-config
      - name: Run disposable authoritative workflow smoke
        run: python scripts/authoritative_smoke.py
      - if: always()
        run: docker compose -f compose.sandbox.yml logs --no-color > container-logs.txt
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-failure-logs
          path: container-logs.txt
          retention-days: 7
      - if: always()
        run: docker compose -f compose.sandbox.yml down --volumes
