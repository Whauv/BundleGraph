services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bundlegraph
      POSTGRES_USER: bundlegraph
      POSTGRES_PASSWORD: local-sandbox-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bundlegraph"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - bundlegraph-postgres:/var/lib/postgresql/data

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      BUNDLEGRAPH_MODE: application
      DATABASE_URL: postgresql://bundlegraph:local-sandbox-only@postgres:5432/bundlegraph
      BUNDLEGRAPH_AUTH_IDENTITIES: '{"0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b":{"subject":"local-user","roles":[]}}'
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m bundlegraph_app.manage migrate && python -m bundlegraph_app.manage activate-local-demo-catalog && exec python -m uvicorn bundlegraph_app.main:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  bundlegraph-postgres:
