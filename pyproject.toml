[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlegraph"
version = "0.1.0"
description = "Evidence-aware podcast bundle planning domain model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
